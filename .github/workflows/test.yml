name: tests

on:
  push:
  pull_request:

jobs:
  unit-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python -m venv .venv
          .venv/bin/python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full suite with LibreOffice in Docker
        run: |
          docker compose build test
          docker compose run --rm test
      - name: Converter image builds
        run: docker build -f docker/Dockerfile.converter -t pub2pdf-converter .
